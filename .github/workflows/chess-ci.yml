name: Dori Chess CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/dori-chess-major-refresh

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run chess rules and lesson tests
        run: npm run test -- --run
      - name: Build production bundle
        run: npm run build
