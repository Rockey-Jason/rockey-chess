```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎰 돌이 뽑기</title>

<style>

/* =========================
   기본 설정
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        Arial,
        "Malgun Gothic",
        sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at 50% 10%,
            #49349b 0%,
            transparent 35%
        ),
        radial-gradient(
            circle at 10% 90%,
            #173d75 0%,
            transparent 40%
        ),
        #080914;
}


/* =========================
   헤더
========================= */

header {
    height: 72px;

    padding: 0 30px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(5, 6, 20, 0.8);

    border-bottom:
        1px solid rgba(255,255,255,0.1);

    backdrop-filter: blur(15px);
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.coin {
    padding: 10px 18px;

    border-radius: 30px;

    background:
        rgba(255,255,255,0.08);

    font-size: 18px;

    border:
        1px solid rgba(255,255,255,0.1);
}


/* =========================
   메인
========================= */

main {
    width: min(900px, 92%);

    margin: auto;

    padding:
        55px 0 100px;
}

.title {
    text-align: center;
}

.title h1 {
    font-size: 46px;

    margin:
        0 0 10px;
}

.title p {
    color: #aaa;

    margin-bottom: 40px;
}


/* =========================
   상자
========================= */

.box-area {

    display: flex;

    justify-content: center;

    align-items: center;

    height: 270px;
}

.box {

    width: 180px;
    height: 180px;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 95px;

    border-radius: 32px;

    background:
        linear-gradient(
            145deg,
            #7052db,
            #2c176e
        );

    box-shadow:
        0 25px 70px rgba(0,0,0,0.5),
        inset 0 0 35px
        rgba(255,255,255,0.12);

    transition:
        transform 0.2s,
        box-shadow 0.2s;

    user-select: none;
}


/* 뽑기 중 */

.box.shake {

    animation:
        shake
        0.65s
        infinite;
}

@keyframes shake {

    0% {
        transform:
            rotate(0deg)
            scale(1);
    }

    20% {
        transform:
            rotate(-10deg)
            scale(1.05);
    }

    40% {
        transform:
            rotate(10deg)
            scale(1.1);
    }

    60% {
        transform:
            rotate(-8deg)
            scale(1.05);
    }

    80% {
        transform:
            rotate(8deg)
            scale(1.1);
    }

    100% {
        transform:
            rotate(0deg)
            scale(1);
    }
}


/* =========================
   버튼
========================= */

.price {

    text-align: center;

    color: #bbb;

    margin-bottom: 20px;
}

.buttons {

    display: flex;

    justify-content: center;

    gap: 10px;

    flex-wrap: wrap;
}

button {

    border: none;

    cursor: pointer;

    font-size: 16px;

    font-weight: bold;

    color: white;

    transition:
        transform 0.15s,
        opacity 0.15s;
}

button:hover {

    transform:
        translateY(-2px);
}

button:active {

    transform:
        translateY(1px);
}

.draw {

    padding:
        16px 45px;

    border-radius: 30px;

    background:
        linear-gradient(
            135deg,
            #8060ed,
            #4d2bb7
        );

    box-shadow:
        0 10px 30px
        rgba(90,60,200,0.35);
}

.draw:disabled {

    opacity: 0.5;

    cursor:
        not-allowed;
}

.secondary {

    padding:
        16px 25px;

    border-radius: 30px;

    background:
        rgba(255,255,255,0.08);
}


/* =========================
   섹션
========================= */

.section {

    margin-top: 70px;
}

.section h2 {

    margin-bottom: 20px;
}


/* =========================
   보관함
========================= */

.inventory {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(170px, 1fr)
        );

    gap: 15px;
}

.item {

    padding: 22px;

    text-align: center;

    border-radius: 18px;

    background:
        rgba(255,255,255,0.06);

    border:
        1px solid
        rgba(255,255,255,0.08);

    transition:
        transform 0.2s;
}

.item:hover {

    transform:
        translateY(-4px);
}

.item-icon {

    font-size: 48px;

    margin-bottom: 10px;
}

.item-name {

    font-weight: bold;

    margin-bottom: 8px;
}

.item-rarity {

    font-size: 13px;

    color: #aaa;
}

.item-count {

    margin-top: 8px;

    color: #bbb;
}


/* =========================
   기록
========================= */

.history-item {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 15px 18px;

    margin-bottom: 10px;

    border-radius: 14px;

    background:
        rgba(255,255,255,0.05);
}

.history-left {

    display: flex;

    align-items: center;

    gap: 12px;
}

.history-icon {

    font-size: 30px;
}

.history-time {

    color: #777;

    font-size: 12px;
}


/* =========================
   모달
========================= */

.modal {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,0.78);

    backdrop-filter:
        blur(8px);

    z-index: 100;
}

.modal.show {

    display: flex;
}

.modal-box {

    width: min(
        430px,
        100%
    );

    padding: 40px;

    text-align: center;

    border-radius: 28px;

    background:
        #15162d;

    border:
        1px solid
        rgba(255,255,255,0.1);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,0.6);

    animation:
        modalIn
        0.3s
        ease;
}

@keyframes modalIn {

    from {

        transform:
            scale(0.7);

        opacity: 0;
    }

    to {

        transform:
            scale(1);

        opacity: 1;
    }
}

.result-icon {

    font-size: 100px;

    margin:
        20px 0;
}

.result-rarity {

    font-size: 16px;

    color: #aaa;

    margin-bottom: 8px;
}

.result-name {

    font-size: 28px;

    font-weight: bold;

    margin-bottom: 20px;
}

.result-reward {

    color: #ffd85c;

    margin-bottom: 25px;
}


/* =========================
   확률표
========================= */

.probability-list {

    text-align: left;

    margin:
        25px 0;
}

.probability {

    display: flex;

    justify-content: space-between;

    padding: 13px 0;

    border-bottom:
        1px solid
        rgba(255,255,255,0.08);
}

.probability:last-child {

    border-bottom:
        none;
}


/* =========================
   초기화
========================= */

.reset {

    display: block;

    margin:
        60px auto 0;

    padding:
        9px 18px;

    border-radius: 20px;

    color: #777;

    background:
        rgba(255,255,255,0.04);

    font-size: 13px;
}


/* =========================
   모바일
========================= */

@media(max-width:600px) {

    header {

        padding:
            0 15px;
    }

    .logo {

        font-size: 19px;
    }

    .coin {

        font-size: 14px;
    }

    .title h1 {

        font-size: 34px;
    }

    .box {

        width: 150px;
        height: 150px;

        font-size: 75px;
    }
}

</style>
</head>


<body>


<!-- =========================
     헤더
========================= -->

<header>

    <div class="logo">
        🐶 돌이 뽑기
    </div>

    <div class="coin">
        🪙
        <span id="coin">10,000</span>
    </div>

</header>


<main>


<!-- =========================
     뽑기
========================= -->

<section class="title">

    <h1>🎰 돌이 상자</h1>

    <p>
        돌돌코인을 사용해서 다양한 아이템을 뽑아보세요!
    </p>

</section>


<div class="box-area">

    <div
        id="gachaBox"
        class="box"
    >
        🎁
    </div>

</div>


<div class="price">

    1회 뽑기 · 🪙 1,000

</div>


<div class="buttons">

    <button
        id="drawButton"
        class="draw"
    >
        🎰 뽑기
    </button>

    <button
        id="probabilityButton"
        class="secondary"
    >
        📊 확률
    </button>

</div>



<!-- =========================
     보관함
========================= -->

<section class="section">

    <h2>
        🎒 내 보관함
    </h2>

    <div
        id="inventory"
        class="inventory"
    ></div>

</section>



<!-- =========================
     기록
========================= -->

<section class="section">

    <h2>
        📜 최근 뽑기
    </h2>

    <div
        id="history"
    ></div>

</section>


<button
    id="resetButton"
    class="reset"
>
    🔄 데이터 초기화
</button>


</main>



<!-- =========================
     결과 모달
========================= -->

<div
    id="resultModal"
    class="modal"
>

    <div class="modal-box">

        <h2>
            🎉 뽑기 결과!
        </h2>

        <div
            id="resultIcon"
            class="result-icon"
        >
            🎁
        </div>

        <div
            id="resultRarity"
            class="result-rarity"
        >
            일반
        </div>

        <div
            id="resultName"
            class="result-name"
        >
            아이템
        </div>

        <div
            id="resultReward"
            class="result-reward"
        ></div>

        <button
            id="closeModal"
            class="draw"
        >
            확인
        </button>

    </div>

</div>



<!-- =========================
     확률 모달
========================= -->

<div
    id="probabilityModal"
    class="modal"
>

    <div class="modal-box">

        <h2>
            📊 획득 확률
        </h2>

        <div
            id="probabilityList"
            class="probability-list"
        ></div>

        <button
            id="closeProbability"
            class="secondary"
        >
            닫기
        </button>

    </div>

</div>



<script>

/* ==================================================
   🎰 돌이 뽑기 시스템
================================================== */


/* -------------------------
   설정
------------------------- */

const GACHA_PRICE = 1000;

const STARTING_COINS = 10000;


/* -------------------------
   뽑기 아이템
------------------------- */

const items = [

    {
        id: "coin500",
        name: "500 돌돌코인",
        icon: "🪙",
        rarity: "일반",
        probability: 35,
        type: "coin",
        reward: 500
    },

    {
        id: "coin1000",
        name: "1,000 돌돌코인",
        icon: "🪙",
        rarity: "일반",
        probability: 25,
        type: "coin",
        reward: 1000
    },

    {
        id: "doriHat",
        name: "돌이 모자",
        icon: "🎩",
        rarity: "희귀",
        probability: 15,
        type: "item",
        reward: 0
    },

    {
        id: "doriGlasses",
        name: "돌이 안경",
        icon: "👓",
        rarity: "희귀",
        probability: 10,
        type: "item",
        reward: 0
    },

    {
        id: "specialTitle",
        name: "특별 칭호",
        icon: "🏷️",
        rarity: "영웅",
        probability: 7,
        type: "item",
        reward: 0
    },

    {
        id: "rareBackground",
        name: "희귀 배경",
        icon: "🌌",
        rarity: "전설",
        probability: 5,
        type: "item",
        reward: 0
    },

    {
        id: "legendarySkin",
        name: "전설 돌이 스킨",
        icon: "🐶",
        rarity: "신화",
        probability: 3,
        type: "item",
        reward: 0
    }

];


/* -------------------------
   데이터 불러오기
------------------------- */

let coins =
    Number(
        localStorage.getItem(
            "doriCoins"
        )
    );

if (
    !Number.isFinite(coins)
) {

    coins =
        STARTING_COINS;
}


let inventory =
    JSON.parse(
        localStorage.getItem(
            "doriInventory"
        )
    ) || {};


let history =
    JSON.parse(
        localStorage.getItem(
            "doriGachaHistory"
        )
    ) || [];



/* -------------------------
   HTML 요소
------------------------- */

const coinElement =
    document.getElementById(
        "coin"
    );

const box =
    document.getElementById(
        "gachaBox"
    );

const drawButton =
    document.getElementById(
        "drawButton"
    );

const inventoryElement =
    document.getElementById(
        "inventory"
    );

const historyElement =
    document.getElementById(
        "history"
    );


/* 결과 */

const resultModal =
    document.getElementById(
        "resultModal"
    );

const resultIcon =
    document.getElementById(
        "resultIcon"
    );

const resultRarity =
    document.getElementById(
        "resultRarity"
    );

const resultName =
    document.getElementById(
        "resultName"
    );

const resultReward =
    document.getElementById(
        "resultReward"
    );


/* 확률 */

const probabilityModal =
    document.getElementById(
        "probabilityModal"
    );

const probabilityList =
    document.getElementById(
        "probabilityList"
    );



/* -------------------------
   코인 표시
------------------------- */

function updateCoins() {

    coinElement.textContent =
        coins.toLocaleString();

    localStorage.setItem(
        "doriCoins",
        coins
    );
}


/* -------------------------
   저장
------------------------- */

function saveData() {

    localStorage.setItem(
        "doriCoins",
        coins
    );

    localStorage.setItem(
        "doriInventory",
        JSON.stringify(
            inventory
        )
    );

    localStorage.setItem(
        "doriGachaHistory",
        JSON.stringify(
            history
        )
    );
}


/* -------------------------
   랜덤 아이템
------------------------- */

function drawRandomItem() {

    const random =
        Math.random() * 100;

    let current = 0;

    for (
        const item of items
    ) {

        current +=
            item.probability;

        if (
            random <= current
        ) {

            return item;
        }

    }

    return items[
        items.length - 1
    ];
}


/* -------------------------
   뽑기
------------------------- */

function drawGacha() {

    if (
        coins < GACHA_PRICE
    ) {

        alert(
            "🪙 돌돌코인이 부족합니다!"
        );

        return;
    }


    /* 코인 차감 */

    coins -=
        GACHA_PRICE;

    updateCoins();


    /* 버튼 잠금 */

    drawButton.disabled =
        true;


    /* 상자 애니메이션 */

    box.classList.add(
        "shake"
    );


    /* 결과 */

    setTimeout(() => {

        box.classList.remove(
            "shake"
        );


        const item =
            drawRandomItem();


        /* 보상 */

        if (
            item.type === "coin"
        ) {

            coins +=
                item.reward;

        }
        else {

            if (
                !inventory[
                    item.id
                ]
            ) {

                inventory[
                    item.id
                ] = 0;

            }

            inventory[
                item.id
            ]++;
        }


        /* 기록 */

        history.unshift({

            id:
                item.id,

            name:
                item.name,

            icon:
                item.icon,

            rarity:
                item.rarity,

            time:
                new Date()
                    .toLocaleString(
                        "ko-KR"
                    )

        });


        /* 최대 20개 */

        history =
            history.slice(
                0,
                20
            );


        saveData();

        updateCoins();

        renderInventory();

        renderHistory();

        showResult(
            item
        );


        drawButton.disabled =
            false;

    }, 1400);

}


/* -------------------------
   결과 표시
------------------------- */

function showResult(
    item
) {

    resultIcon.textContent =
        item.icon;

    resultRarity.textContent =
        item.rarity;

    resultName.textContent =
        item.name;


    if (
        item.type === "coin"
    ) {

        resultReward.textContent =
            `🪙 +${item.reward.toLocaleString()} 돌돌코인`;

    }
    else {

        resultReward.textContent =
            "🎒 보관함에 추가되었습니다!";

    }


    resultModal.classList.add(
        "show"
    );

}


/* -------------------------
   보관함
------------------------- */

function renderInventory() {

    inventoryElement.innerHTML =
        "";


    const owned =
        items.filter(
            item =>
                item.type === "item" &&
                inventory[item.id] > 0
        );


    if (
        owned.length === 0
    ) {

        inventoryElement.innerHTML =

            `<div style="
                grid-column:1/-1;
                text-align:center;
                color:#777;
                padding:30px;
            ">
                아직 획득한 아이템이 없습니다 🐶
            </div>`;

        return;
    }


    owned.forEach(
        item => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "item";

            div.innerHTML = `

                <div class="item-icon">
                    ${item.icon}
                </div>

                <div class="item-name">
                    ${item.name}
                </div>

                <div class="item-rarity">
                    ${item.rarity}
                </div>

                <div class="item-count">
                    × ${inventory[item.id]}
                </div>

            `;

            inventoryElement.appendChild(
                div
            );

        }
    );

}


/* -------------------------
   기록
------------------------- */

function renderHistory() {

    historyElement.innerHTML =
        "";


    if (
        history.length === 0
    ) {

        historyElement.innerHTML =

            `<div style="
                text-align:center;
                color:#777;
                padding:30px;
            ">
                아직 뽑기 기록이 없습니다 🎰
            </div>`;

        return;
    }


    history.forEach(
        item => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "history-item";

            div.innerHTML = `

                <div class="history-left">

                    <div class="history-icon">
                        ${item.icon}
                    </div>

                    <div>

                        <div>
                            ${item.name}
                        </div>

                        <div class="history-time">
                            ${item.time}
                        </div>

                    </div>

                </div>

                <div>
                    ${item.rarity}
                </div>

            `;

            historyElement.appendChild(
                div
            );

        }
    );

}


/* -------------------------
   확률표
------------------------- */

function renderProbability() {

    probabilityList.innerHTML =
        "";


    items.forEach(
        item => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "probability";

            div.innerHTML = `

                <span>
                    ${item.icon}
                    ${item.name}
                </span>

                <strong>
                    ${item.probability}%
                </strong>

            `;

            probabilityList.appendChild(
                div
            );

        }
    );

}


/* -------------------------
   결과 닫기
------------------------- */

document
    .getElementById(
        "closeModal"
    )
    .onclick = () => {

        resultModal.classList.remove(
            "show"
        );

    };


/* -------------------------
   확률 열기
------------------------- */

document
    .getElementById(
        "probabilityButton"
    )
    .onclick = () => {

        renderProbability();

        probabilityModal.classList.add(
            "show"
        );

    };


/* -------------------------
   확률 닫기
------------------------- */

document
    .getElementById(
        "closeProbability"
    )
    .onclick = () => {

        probabilityModal.classList.remove(
            "show"
        );

    };


/* -------------------------
   뽑기 버튼
------------------------- */

drawButton.onclick =
    drawGacha;


/* -------------------------
   초기화
------------------------- */

document
    .getElementById(
        "resetButton"
    )
    .onclick = () => {

        const yes =
            confirm(
                "정말 모든 뽑기 데이터를 초기화할까요?"
            );

        if (!yes)
            return;


        localStorage.removeItem(
            "doriCoins"
        );

        localStorage.removeItem(
            "doriInventory"
        );

        localStorage.removeItem(
            "doriGachaHistory"
        );


        location.reload();

    };


/* -------------------------
   시작
------------------------- */

updateCoins();

renderInventory();

renderHistory();

</script>

</body>
</html>
```
